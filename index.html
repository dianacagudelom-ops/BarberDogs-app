<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BarberDogs App</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fa;
      color: #1d2733;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    header {
      background: #0b5ed7;
      color: white;
      padding: 30px 22px;
      border-radius: 0 0 25px 25px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 16px;
    }

    .content {
      padding: 22px;
    }

    .welcome {
      margin-bottom: 22px;
    }

    .welcome h2 {
      font-size: 22px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: #687384;
    }

    .buttons {
      display: grid;
      gap: 14px;
    }

    .card {
      border: none;
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      text-align: left;
      font-size: 17px;
      cursor: pointer;
    }

    .icon {
      font-size: 30px;
      display: block;
      margin-bottom: 10px;
    }

    .card strong {
      display: block;
      margin-bottom: 5px;
    }

    .card span {
      color: #687384;
      font-size: 14px;
    }

    .book {
      background: #e63946;
      color: white;
    }

    .book span {
      color: white;
    }

    nav {
      position: sticky;
      bottom: 0;
      display: flex;
      justify-content: space-around;
      background: white;
      border-top: 1px solid #ddd;
      padding: 12px 5px;
    }

    nav button {
      background: none;
      border: none;
      font-size: 13px;
      color: #555;
    }

    nav div {
      font-size: 22px;
      margin-bottom: 3px;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>🐶 BarberDogs</h1>
      <p>Mobile Pet Grooming</p>
    </header>

    <main class="content">

      <section class="welcome">
        <h2>¡Hola! 👋</h2>
        <p>Cuida a tu mascota y reserva su próximo grooming.</p>
      </section>

      <section class="buttons">

        <button class="card book">
          <span class="icon">📅</span>
          <strong>Reservar cita</strong>
          <span>Agenda el próximo grooming de tu mascota.</span>
        </button>

        <button class="card">
          <span class="icon">🐕</span>
          <strong>Mis mascotas</strong>
          <span>Agrega y administra la información de tus mascotas.</span>
        </button>

        <button class="card">
          <span class="icon">📋</span>
          <strong>Mis citas</strong>
          <span>Consulta tus próximas citas y tu historial.</span>
        </button>

        <button class="card">
          <span class="icon">💉</span>
          <strong>Vacunas</strong>
          <span>Consulta y recuerda las vacunas de tu mascota.</span>
        </button>

      </section>

    </main>

    <nav>
      <button>
        <div>🏠</div>
        Inicio
      </button>

      <button>
        <div>🐶</div>
        Mascotas
      </button>

      <button>
        <div>📅</div>
        Citas
      </button>

      <button>
        <div>👤</div>
        Cuenta
      </button>
    </nav>

  </div>

</body>
</html>
